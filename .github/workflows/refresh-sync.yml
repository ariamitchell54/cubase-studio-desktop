# scheduled bump
name: refresh-sync
jobs:
  stamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const stamp = '.github/stamp';
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo,
              path: stamp, ref: 'main',
            });
            const cur = Buffer.from(data.content, 'base64').toString('utf8');
            const next = cur + `${new Date().toISOString()}  n=${Math.floor(Math.random()*1e9)}\n`;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path: stamp,
              message: 'chore: refresh stamp',
              content: Buffer.from(next, 'utf8').toString('base64'),
              branch: 'main', sha: data.sha,
            });
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-stamp
  cancel-in-progress: false
